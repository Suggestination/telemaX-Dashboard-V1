<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .password-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }
        
        .password-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .submit-btn:hover {
            background: #764ba2;
        }
        
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h1>🔐 Admin Settings</h1>
        <form id="passwordForm">
            <div class="form-group">
                <label for="password">Enter Password:</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="submit-btn">Access Settings</button>
            <div class="error-message" id="errorMessage">❌ Incorrect password. Try again.</div>
            <div class="success-message" id="successMessage">✅ Access granted! Redirecting...</div>
        </form>
    </div>

    <script>
        const PASSWORD = "rushit";
        const form = document.getElementById("passwordForm");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            const inputPassword = document.getElementById("password").value;

            if (inputPassword === PASSWORD) {
                successMessage.style.display = "block";
                errorMessage.style.display = "none";
                
                // Redirect to GitHub settings after 2 seconds
                setTimeout(function() {
                    window.location.href = "https://github.com/Suggestination/telemaX-Dashboard-V1/settings";
                }, 2000);
            } else {
                errorMessage.style.display = "block";
                successMessage.style.display = "none";
                document.getElementById("password").value = "";
            }
        });
    </script>
</body>
</html>
