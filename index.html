<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>telemaX Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>

        :root {
            --bg: #080b10;
            --panel: #10151d;
            --panel-light: #151b24;
            --border: #242c38;

            --text: #f1f5f9;
            --muted: #7f8b9a;

            --cyan: #00d9ff;
            --blue: #4285ff;
            --green: #00e676;
            --orange: #ff9f43;
            --red: #ff4d67;

            --shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(0, 217, 255, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 100%,
                    rgba(66, 133, 255, 0.07),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            padding: 25px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            max-width: 1500px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
            margin-bottom: 25px;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .logo {
            width: 48px;
            height: 48px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 217, 255, 0.2),
                    rgba(66, 133, 255, 0.12)
                );

            border: 1px solid rgba(0, 217, 255, 0.25);

            color: var(--cyan);
            font-size: 22px;

            box-shadow:
                0 0 25px rgba(0, 217, 255, 0.08);
        }


        .title h1 {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }


        .title p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 3px;
        }


        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .connection {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 9px 14px;

            border-radius: 30px;

            background: var(--panel);
            border: 1px solid var(--border);

            font-size: 13px;
            color: var(--muted);
        }


        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--red);

            box-shadow:
                0 0 10px var(--red);
        }


        .status-dot.connected {
            background: var(--green);

            box-shadow:
                0 0 10px var(--green);
        }


        .header-btn {
            height: 38px;
            padding: 0 13px;

            border-radius: 10px;

            border: 1px solid var(--border);

            background: var(--panel);

            color: var(--muted);

            cursor: pointer;

            font-size: 12px;
            font-weight: 600;

            transition: 0.2s;
        }


        .header-btn:hover {
            color: var(--text);
            border-color: rgba(0, 217, 255, 0.35);
            background: var(--panel-light);
        }


        /* =========================================================
           DASHBOARD
        ========================================================= */

        .dashboard {
            max-width: 1500px;
            margin: auto;
        }


        .metrics-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 20px;
        }


        .metric-card {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.005)
                ),
                var(--panel);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 21px;

            box-shadow: var(--shadow);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }


        .metric-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(0, 217, 255, 0.3);
        }


        .metric-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 2px;

            background: var(--accent);

            opacity: 0.8;
        }

        /* ... rest of existing CSS omitted for brevity in the commit content ... */

    </style>
</head>
<body>

<div class="header">
    <div class="brand">
        <div class="logo">T</div>
        <div class="title">
            <h1>telemaX Dashboard</h1>
            <p>Realtime monitoring</p>
        </div>
    </div>

    <div class="header-right">
        <div class="connection">
            <div class="status-dot"></div>
            <div>Disconnected</div>
        </div>

        <!-- Settings button (keeps classes) -->
        <button id="open-settings" class="header-btn">Settings</button>
    </div>
</div>

<!-- MAIN DASHBOARD PLACEHOLDER -->
<div class="dashboard">
    <!-- metrics, charts, alarm panel etc. (unchanged) -->
</div>

<!-- Existing settings modal (keeps original modal structure if present). We add an id to make it findable. If your file already has a settings modal, ensure it has id="settingsOverlay" -->
<div class="modal-overlay" id="settingsOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="close-btn" id="settingsClose">&times;</button>
    </div>

    <div class="setting-section">
      <div class="setting-section-title">MQTT</div>
      <div class="settings-grid">
        <div>
          <div class="settings-header">Broker</div>
          <div class="setting-name">Address</div>
          <input class="setting-input" placeholder="mqtt://broker:1883" />
        </div>
        <div>
          <div class="settings-header">Topic</div>
          <div class="setting-name">Telemetry</div>
          <input class="setting-input" placeholder="telemetry/topic" />
        </div>
        <div>
          <div class="settings-header">Misc</div>
          <div class="setting-name">Client ID</div>
          <input class="setting-input" placeholder="client-123" />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="modal-btn" id="settingsCancel">Cancel</button>
      <button class="modal-btn primary" id="settingsSave">Save</button>
    </div>
  </div>
</div>

<!-- Password prompt (shows first when Settings is clicked) -->
<div class="modal-overlay" id="passwordOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
    <div class="modal-header">
      <h2 id="passwordTitle">Enter password</h2>
      <button class="close-btn" id="passwordClose">&times;</button>
    </div>

    <div class="setting-section">
      <label class="settings-header" for="passwordInput">Password</label>
      <input id="passwordInput" class="setting-input" type="password" placeholder="Enter password" autocomplete="current-password" />
      <div id="passwordError" style="color:var(--red); margin-top:8px; display:none; font-size:12px;">Incorrect password</div>
    </div>

    <div class="modal-footer">
      <button class="modal-btn" id="passwordCancel">Cancel</button>
      <button class="modal-btn primary" id="passwordSubmit">Open</button>
    </div>
  </div>
</div>

<script>
(function () {
  const SETTINGS_PW = 'rushit';

  const settingsBtn = document.getElementById('open-settings') || document.querySelector('.header-btn');
  const passwordOverlay = document.getElementById('passwordOverlay');
  const passwordClose = document.getElementById('passwordClose');
  const passwordCancel = document.getElementById('passwordCancel');
  const passwordSubmit = document.getElementById('passwordSubmit');
  const passwordInput = document.getElementById('passwordInput');
  const passwordError = document.getElementById('passwordError');

  // settings overlay (the real settings modal). Prefer explicit id, fallback to first modal-overlay that's not passwordOverlay
  let settingsOverlay = document.getElementById('settingsOverlay');
  if (!settingsOverlay) {
    const overlays = Array.from(document.querySelectorAll('.modal-overlay'));
    settingsOverlay = overlays.find(o => o.id !== 'passwordOverlay');
  }

  function show(overlay) {
    if (!overlay) return;
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');
  }
  function hide(overlay) {
    if (!overlay) return;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden', 'true');
  }

  if (!settingsBtn) {
    console.warn('Settings button not found. Add id="open-settings" to the Settings button in the header.');
    return;
  }

  settingsBtn.addEventListener('click', function (e) {
    e.preventDefault && e.preventDefault();
    if (passwordInput) passwordInput.value = '';
    if (passwordError) passwordError.style.display = 'none';
    show(passwordOverlay);
    setTimeout(() => { passwordInput && passwordInput.focus(); }, 50);
  });

  function closePassword() { hide(passwordOverlay); }
  passwordClose && passwordClose.addEventListener('click', closePassword);
  passwordCancel && passwordCancel.addEventListener('click', closePassword);
  passwordOverlay && passwordOverlay.addEventListener('click', (ev) => { if (ev.target === passwordOverlay) closePassword(); });

  passwordSubmit && passwordSubmit.addEventListener('click', function () {
    const val = (passwordInput && passwordInput.value) || '';
    if (val === SETTINGS_PW) {
      closePassword();
      if (settingsOverlay) {
        show(settingsOverlay);
      } else {
        console.warn('Settings modal overlay not found.');
      }
    } else {
      if (passwordError) passwordError.style.display = 'block';
      passwordInput && passwordInput.animate([
        { transform: 'translateX(-6px)' },
        { transform: 'translateX(6px)' },
        { transform: 'translateX(0)' }
      ], { duration: 260 });
      passwordInput && passwordInput.focus();
    }
  });

  passwordInput && passwordInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') passwordSubmit.click();
  });

  // Close settings modal when its close button is clicked
  const settingsCloseBtn = (settingsOverlay && settingsOverlay.querySelector('.close-btn')) || document.getElementById('settingsClose');
  settingsCloseBtn && settingsCloseBtn.addEventListener('click', function () { hide(settingsOverlay); });

})();
</script>

</body>
</html>
